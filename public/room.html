<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Room — Streamer</title>
    <!-- The room id is the access credential, so it must never travel in a Referer header. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="modulepreload" href="/js/main-room.js" />
    <link rel="modulepreload" href="/shared/protocol.js" />
  </head>

  <body>
    <!-- ================= Lobby: name + mic, before joining ================= -->
    <div id="lobby" class="lobby">
      <div class="lobby__card">
        <div class="lobby__head">
          <h1 id="lobby-title">Join the room</h1>
          <p id="lobby-sub" class="field__hint">
            Your microphone starts muted. Nothing is recorded.
          </p>
        </div>

        <div id="lobby-banner" hidden></div>

        <form id="lobby-form" class="lobby__fields" novalidate>
          <div class="field">
            <label class="field__label" for="name">Your name</label>
            <input
              id="name"
              class="input"
              type="text"
              maxlength="32"
              autocomplete="nickname"
              placeholder="How others will see you"
              required
            />
            <p id="name-error" class="field__error" hidden></p>
          </div>

          <!-- The microphone check. Placed before the join button on purpose: this is the
               last moment a dead or blocked microphone can be fixed without an audience. -->
          <div class="field">
            <span class="field__label">Microphone</span>
            <div class="miccheck" data-testid="lobby-mic-check">
              <div class="meter" role="img" aria-label="Microphone level">
                <div class="meter__fill" id="lobby-meter-fill" data-testid="lobby-meter"></div>
              </div>
              <p class="field__hint" id="lobby-mic-status" data-testid="lobby-mic-status">
                Checking…
              </p>
              <!-- Which microphone. Populated once permission is granted (labels are blank
                   before that). The default the browser picks on Windows is often not the
                   headset, and this is the one moment to find that out without an audience. -->
              <select
                id="lobby-mic-device"
                class="input input--sm"
                data-testid="lobby-mic-device"
                aria-label="Microphone"
                hidden
              ></select>
            </div>
          </div>

          <div class="field" id="access-code-field" hidden>
            <label class="field__label" for="access-code">Access code</label>
            <input id="access-code" class="input" type="text" autocomplete="off" />
          </div>

          <button id="lobby-submit" class="btn btn--primary btn--lg btn--block" type="submit">
            Join room
          </button>
        </form>
      </div>
    </div>

    <!-- ========================= Room ========================= -->
    <div id="room" class="room" hidden>
      <header class="topbar">
        <span class="topbar__brand">
          <svg class="btn__icon" aria-hidden="true" focusable="false">
            <use href="/assets/icons.svg#screen"></use>
          </svg>
          Streamer
        </span>

        <span id="live-badge" class="badge badge--live" hidden>LIVE</span>

        <span class="topbar__spacer"></span>

        <div class="topbar__meta">
          <div class="link-box">
            <span id="share-link" class="link-box__url" data-testid="share-link"></span>
            <button
              id="copy-link"
              class="btn btn--ghost btn--sm"
              type="button"
              data-testid="copy-link"
              aria-label="Copy room link"
            >
              <svg class="btn__icon" aria-hidden="true" focusable="false">
                <use href="/assets/icons.svg#copy"></use>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <!-- Persistent conditions live here; transient events use toasts. -->
      <div id="room-banner" hidden></div>

      <div class="room__body">
        <main class="stage" id="stage">
          <div class="stage__empty" id="stage-empty">
            <svg
              width="48"
              height="48"
              aria-hidden="true"
              focusable="false"
              class="stage__empty-icon"
            >
              <use href="/assets/icons.svg#screen"></use>
            </svg>
            <p id="stage-empty-text">No one is sharing a screen yet.</p>
            <p class="field__hint">Press Share screen below to start.</p>
          </div>

          <!-- muted: this element carries picture only. Remote audio plays through dedicated
               <audio> elements so muting a tile can never mute a person. -->
          <video
            id="stage-video"
            class="stage__video"
            autoplay
            playsinline
            muted
            data-testid="stage-video"
            hidden
          ></video>

          <div id="stage-label" class="stage__label" hidden></div>

          <!-- Fullscreen puts #stage alone on the screen, and the real control bar is outside
               it. Without these the user would be stranded with no way to mute or get out
               except a keyboard shortcut they have not been told about. Auto-hides. -->
          <div id="stage-overlay" class="stage__overlay" data-testid="stage-overlay" hidden>
            <button id="overlay-mic" class="ctl ctl--sm" type="button" data-testid="overlay-mic">
              <svg class="btn__icon" aria-hidden="true" focusable="false">
                <use href="/assets/icons.svg#mic" id="overlay-mic-icon"></use>
              </svg>
              <span id="overlay-mic-label">Mute</span>
            </button>
            <div class="meter meter--overlay">
              <div class="meter__fill" id="overlay-meter-fill" data-testid="overlay-meter"></div>
            </div>
            <button id="overlay-exit" class="ctl ctl--sm" type="button" data-testid="overlay-exit">
              <svg class="btn__icon" aria-hidden="true" focusable="false">
                <use href="/assets/icons.svg#fullscreen"></use>
              </svg>
              <span>Exit fullscreen</span>
            </button>
          </div>
        </main>

        <aside class="roster">
          <div class="roster__head">
            <span>Participants</span>
            <span class="badge badge--neutral" id="participant-count" data-testid="participants-count">1</span>
          </div>
          <div class="roster__list" id="roster-list"></div>
          <div class="roster__foot" id="stats-panel" hidden></div>
        </aside>
      </div>

      <footer class="controlbar">
        <!-- The microphone group: the mute button carries an always-visible level bar (the
             fullscreen overlay's bar is the only other one, and it is hidden until then), a
             caret opens the device / processing / diagnostics menu, and a one-line verdict
             sits above the group when something needs saying. -->
        <div class="ctl-group" id="mic-group">
          <button id="mic-toggle" class="ctl" type="button" data-testid="mic-toggle">
            <svg class="ctl__icon" aria-hidden="true" focusable="false">
              <use id="mic-icon" href="/assets/icons.svg#mic"></use>
            </svg>
            <span id="mic-label">Mute</span>
            <span class="meter meter--ctl" role="img" aria-label="Microphone level">
              <span class="meter__fill" id="ctl-meter-fill" data-testid="room-meter"></span>
            </span>
          </button>
          <button
            id="mic-menu-toggle"
            class="ctl ctl--caret"
            type="button"
            data-testid="mic-menu-toggle"
            aria-haspopup="true"
            aria-expanded="false"
            aria-label="Microphone options"
            title="Microphone options"
          >
            ▴
          </button>
          <div id="mic-menu" class="quality mic-menu" role="menu" hidden></div>
          <p id="mic-hint" class="ctl__hint" data-testid="mic-hint" hidden></p>
        </div>

        <button id="share-toggle" class="ctl" type="button" data-testid="share-toggle">
          <svg class="ctl__icon" aria-hidden="true" focusable="false">
            <use id="share-icon" href="/assets/icons.svg#screen"></use>
          </svg>
          <span id="share-label">Share screen</span>
        </button>

        <button id="leave" class="ctl ctl--danger" type="button" data-testid="leave">
          <svg class="ctl__icon" aria-hidden="true" focusable="false">
            <use href="/assets/icons.svg#leave"></use>
          </svg>
          <span>Leave</span>
        </button>

        <button id="end-session" class="ctl ctl--danger" type="button" data-testid="end-session" hidden>
          <svg class="ctl__icon" aria-hidden="true" focusable="false">
            <use href="/assets/icons.svg#end"></use>
          </svg>
          <span>End</span>
        </button>

        <div class="controlbar__end">
          <div class="controlbar__anchor">
            <button
              id="quality-toggle"
              class="btn btn--secondary btn--sm"
              type="button"
              data-testid="quality-toggle"
              aria-haspopup="true"
              aria-expanded="false"
            >
              <span id="quality-label">1080p 60</span>
            </button>
            <div id="quality-menu" class="quality" role="radiogroup" hidden></div>
          </div>

          <button
            id="fullscreen-toggle"
            class="btn btn--ghost btn--sm"
            type="button"
            data-testid="fullscreen-toggle"
            title="Fullscreen (F)"
          >
            <svg class="btn__icon" aria-hidden="true" focusable="false">
              <use href="/assets/icons.svg#fullscreen" id="fullscreen-icon"></use>
            </svg>
            <span id="fullscreen-label">Fullscreen</span>
          </button>

          <button id="stats-toggle" class="btn btn--ghost btn--sm" type="button" data-testid="stats-toggle">
            <svg class="btn__icon" aria-hidden="true" focusable="false">
              <use href="/assets/icons.svg#stats"></use>
            </svg>
            Stats
          </button>
        </div>
      </footer>
    </div>

    <!-- Remote audio elements are appended here, outside the video stage. -->
    <div id="audio-sinks" class="audio-sinks" aria-hidden="true"></div>

    <script type="module" src="/js/main-room.js"></script>
  </body>
</html>
